name: tests

on:
  push:
  pull_request:

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      MNEMA_NO_DETECT: "1"
      MNEMA_NO_KEYRING: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpulse0 libportaudio2
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check mnema tests tools packaging
      - name: Format
        run: ruff format --check mnema tests tools packaging
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax of every script
        run: for f in mnema/ui/js/*.js extension/*.js; do node --check "$f"; done
      - name: Code style
        run: npx --yes prettier@3.9.10 --print-width 120 --check "mnema/ui/js/*.js" "mnema/ui/css/*.css" "mnema/ui/index.html" "extension/*.js"
